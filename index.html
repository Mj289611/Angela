<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para Ángela ❤️</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Encabezado con Contador -->
  <header class="hero">
    <h1>Juntos por siempre ❤️</h1>
    <div id="counter" class="counter">Cargando tiempo...</div>
  </header>

  <!-- Panel de Administración / Agregar Contenido -->
  <section class="admin-panel">
    <h2>Añadir a la colección</h2>
    <form id="add-media-form">
      <select id="media-type" required>
        <option value="photo">Imagen (Foto)</option>
        <option value="video">Video</option>
        <option value="music">Música (Audio)</option>
        <option value="note">Nota de Texto</option>
      </select>
      
      <input type="text" id="media-title" placeholder="Título o descripción" required>
      <input type="text" id="media-url" placeholder="Ruta local (ej: img/foto.jpg) o URL" required>
      <button type="submit">Guardar</button>
    </form>
  </section>

  <!-- Navegación por Carpetas -->
  <main class="folders-container">
    
    <!-- Carpeta 1: Fotos -->
    <section class="folder">
      <h2>📸 Galería de Fotos</h2>
      <div id="photos-grid" class="grid grid-916"></div>
    </section>

    <!-- Carpeta 2: Videos -->
    <section class="folder">
      <h2>🎥 Galería de Videos</h2>
      <div id="videos-grid" class="grid grid-916"></div>
    </section>

    <!-- Carpeta 3: Música -->
    <section class="folder">
      <h2>🎵 Nuestra Música</h2>
      <div id="music-list" class="audio-list"></div>
    </section>

    <!-- Carpeta 4: Notas / Textos -->
    <section class="folder">
      <h2>📝 Notas y Recuerdos</h2>
      <div id="notes-grid" class="notes-grid"></div>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
