<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para mi amor ❤️</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Cabecera Romántica -->
  <header class="hero-section">
    <div class="hero-content">
      <h1>Para ti, mi amor ❤️</h1>
      <div id="counter" class="counter-box">Calculando tiempo...</div>
    </div>
  </header>

  <!-- Contenedor de Secciones / Carpetas -->
  <main class="main-container">

    <!-- Carpeta 1: Galería de Fotos -->
    <section class="media-section">
      <div class="section-header">
        <h2>📸 Galería de Fotos</h2>
        <button class="add-btn" onclick="openModal('photo')">+ Agregar</button>
      </div>
      <div id="photos-grid" class="media-grid format-916"></div>
    </section>

    <!-- Carpeta 2: Galería de Videos -->
    <section class="media-section">
      <div class="section-header">
        <h2>🎥 Galería de Videos</h2>
        <button class="add-btn" onclick="openModal('video')">+ Agregar</button>
      </div>
      <div id="videos-grid" class="media-grid format-916"></div>
    </section>

    <!-- Carpeta 3: Nuestra Música -->
    <section class="media-section">
      <div class="section-header">
        <h2>🎵 Nuestra Música</h2>
        <button class="add-btn" onclick="openModal('music')">+ Agregar</button>
      </div>
      <div id="music-list" class="music-grid"></div>
    </section>

    <!-- Carpeta 4: Notas y Recuerdos -->
    <section class="media-section">
      <div class="section-header">
        <h2>📝 Notas y Recuerdos</h2>
        <button class="add-btn" onclick="openModal('note')">+ Agregar</button>
      </div>
      <div id="notes-grid" class="notes-container"></div>
    </section>

  </main>

  <!-- Modal para añadir contenido -->
  <div id="add-modal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <h3 id="modal-title-text">Añadir elemento</h3>
      <form id="dynamic-form">
        <div class="input-group">
          <label>Título o descripción:</label>
          <input type="text" id="item-title" placeholder="Ej: Nuestro recuerdo" required>
        </div>
        <div class="input-group">
          <label>Ruta (ej: img/foto.jpg o video/vid.mp4):</label>
          <input type="text" id="item-url" placeholder="Ruta del archivo" required>
        </div>
        <div class="modal-buttons">
          <button type="button" class="btn-cancel" onclick="closeModal()">Cancelar</button>
          <button type="submit" class="btn-save">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
